[project]
name = "accelerator-pack-auth-service"
version = "1.0.0"
description = "Enterprise auth/authz service for OCI AI Accelerator packs"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "B", "UP"]
ignore = ["S105", "S106", "B008"]  # S10x: test fixtures, B008: FastAPI Depends() pattern

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is fine in tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["accelerator_pack_auth_service"]
# Async route handlers dispatched via httpx ASGITransport hop through the
# event loop; without thread+greenlet concurrency, coverage loses the lines
# after every `await` in route bodies. Set this and the route bodies attribute
# correctly to the test that exercised them.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 80
